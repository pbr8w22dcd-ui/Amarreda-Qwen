<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin CMS — Amarreda</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
  <style>
    .admin-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .admin-card { background: var(--bg-card); border: var(--border-subtle); border-radius: 8px; padding: 24px; margin-bottom: 30px; }
    .admin-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .admin-form .full { grid-column: 1 / -1; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(184, 153, 106, 0.2); border-radius: 6px; color: var(--text-bright); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .btn-admin { padding: 10px 20px; background: var(--rame); color: var(--bg-deep); border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-admin:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; color: white; }
    .models-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .models-table th, .models-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(184, 153, 106, 0.1); color: var(--text-gray); font-size: 0.9rem; }
    .models-table th { color: var(--rame); font-weight: 600; }
    .status-active { color: #22c55e; font-weight: 600; }
    .status-inactive { color: #ef4444; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo"><img src="../assets/logo.svg" alt="Amarreda" class="logo-image"></a>
      <nav class="main-nav">
        <a href="../index.html" class="nav-link">Torna al Sito</a>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
      </nav>
    </div>
  </header>

  <div class="admin-container">
    <div class="admin-header">
      <h1 style="font-family: var(--font-display); color: var(--text-bright);">Pannello di Gestione Catalogo</h1>
      <button class="btn-admin" onclick="toggleForm()">+ Aggiungi Nuovo Modello</button>
    </div>

    <!-- FORM AGGIUNTA/MODIFICA -->
    <div class="admin-card" id="model-form-card" style="display: none;">
      <h3 style="color: var(--rame); margin-bottom: 20px;" id="form-title">Aggiungi Modello</h3>
      <form id="catalog-form" class="admin-form">
        <input type="hidden" id="model-id">
        <div>
          <label style="font-size: 0.85rem; color: var(--text-muted);">Brand *</label>
          <select id="brand" class="form-select" required>
            <option value="Veneta Cucine">Veneta Cucine</option>
            <option value="Stosa">Stosa</option>
            <option value="Lube">Lube</option>
            <option value="Arredo3">Arredo3</option>
            <option value="Altro">Altro</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.85rem; color: var(--text-muted);">Nome Modello *</label>
          <input type="text" id="model_name" class="form-input" required>
        </div>
        <div>
          <label style="font-size: 0.85rem; color: var(--text-muted);">Stile *</label>
          <select id="style" class="form-select" required>
            <option value="moderno">Moderno</option>
            <option value="classico">Classico</option>
            <option value="contemporaneo">Contemporaneo</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.85rem; color: var(--text-muted);">Materiale *</label>
          <select id="material" class="form-select" required>
            <option value="laminato">Laminato</option>
            <option value="laccato">Laccato</option>
            <option value="fenix">Fenix</option>
            <option value="legno">Legno</option>
            <option value="vetro">Vetro</option>
          </select>
        </div>
        <div class="full">
          <label style="font-size: 0.85rem; color: var(--text-muted);">URL Immagine (es: ../assets/catalogo/veneta-essenza.jpg)</label>
          <input type="text" id="image_url" class="form-input" placeholder="Lascia vuoto per placeholder">
        </div>
        <div class="full">
          <label style="font-size: 0.85rem; color: var(--text-muted);">Descrizione</label>
          <textarea id="description" class="form-textarea"></textarea>
        </div>
        <div class="full" style="display: flex; gap: 10px; margin-top: 10px;">
          <button type="submit" class="btn-admin">Salva Modello</button>
          <button type="button" class="btn-admin btn-ghost" onclick="toggleForm()" style="background: transparent; border: 1px solid var(--rame); color: var(--rame);">Annulla</button>
        </div>
      </form>
    </div>

    <!-- TABELLA MODELLI -->
    <div class="admin-card">
      <h3 style="color: var(--text-bright); margin-bottom: 20px;">Modelli Esistenti</h3>
      <div style="overflow-x: auto;">
        <table class="models-table">
          <thead>
            <tr>
              <th>Brand</th>
              <th>Modello</th>
              <th>Stile</th>
              <th>Materiale</th>
              <th>Stato</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="models-tbody">
            <tr><td colspan="6" style="text-align: center;">Caricamento...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script>
    // 1. Controllo Autenticazione
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        alert('Devi essere loggato come amministratore per accedere a questa pagina.');
        window.location.href = 'login.html';
      }
    }
    checkAuth();

    // 2. Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '../index.html';
    });

    // 3. Carica Modelli
    async function loadModels() {
      const { data, error } = await supabaseClient.from('catalog_models').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('models-tbody');
      tbody.innerHTML = '';
      
      if (error || !data) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ef4444;">Errore nel caricamento</td></tr>';
        return;
      }

      data.forEach(model => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${model.brand}</td>
          <td><strong>${model.model_name}</strong></td>
          <td>${model.style}</td>
          <td>${model.material}</td>
          <td class="${model.is_active ? 'status-active' : 'status-inactive'}">${model.is_active ? 'Attivo' : 'Nascosto'}</td>
          <td>
            <button onclick="editModel('${model.id}')" style="background: none; border: none; color: var(--rame); cursor: pointer; margin-right: 10px;">Modifica</button>
            <button onclick="deleteModel('${model.id}')" style="background: none; border: none; color: #ef4444; cursor: pointer;">Elimina</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
    loadModels();

    // 4. Gestione Form
    function toggleForm() {
      const formCard = document.getElementById('model-form-card');
      formCard.style.display = formCard.style.display === 'none' ? 'block' : 'none';
      document.getElementById('catalog-form').reset();
      document.getElementById('model-id').value = '';
      document.getElementById('form-title').textContent = 'Aggiungi Modello';
    }

    document.getElementById('catalog-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('model-id').value;
      const payload = {
        brand: document.getElementById('brand').value,
        model_name: document.getElementById('model_name').value,
        style: document.getElementById('style').value,
        material: document.getElementById('material').value,
        image_url: document.getElementById('image_url').value || null,
        description: document.getElementById('description').value,
        is_active: true
      };

      let error;
      if (id) {
        const res = await supabaseClient.from('catalog_models').update(payload).eq('id', id);
        error = res.error;
      } else {
        const res = await supabaseClient.from('catalog_models').insert(payload);
        error = res.error;
      }

      if (error) {
        alert('Errore: ' + error.message);
      } else {
        alert('Salvato con successo!');
        toggleForm();
        loadModels();
      }
    });

    // 5. Modifica ed Elimina
    async function editModel(id) {
      const { data } = await supabaseClient.from('catalog_models').select('*').eq('id', id).single();
      if (!data) return;
      
      document.getElementById('model-id').value = data.id;
      document.getElementById('brand').value = data.brand;
      document.getElementById('model_name').value = data.model_name;
      document.getElementById('style').value = data.style;
      document.getElementById('material').value = data.material;
      document.getElementById('image_url').value = data.image_url || '';
      document.getElementById('description').value = data.description || '';
      
      document.getElementById('form-title').textContent = 'Modifica Modello';
      document.getElementById('model-form-card').style.display = 'block';
      window.scrollTo(0, 0);
    }

    async function deleteModel(id) {
      if (!confirm('Sei sicuro di voler eliminare questo modello?')) return;
      const { error } = await supabaseClient.from('catalog_models').delete().eq('id', id);
      if (error) alert('Errore: ' + error.message);
      else loadModels();
    }
  </script>
</body>
</html>
