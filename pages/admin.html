<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Admin — Amarreda</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
  <style>
    body { background: var(--bg-deep, #12110F); color: var(--text-bright, #FCFAF6); font-family: 'Manrope', sans-serif; }
    .admin-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
    .admin-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; margin: 0; color: var(--rame, #B8996A); }
    .admin-card { background: rgba(26, 25, 22, 0.7); border: 1px solid rgba(184, 153, 106, 0.2); border-radius: 12px; padding: 24px; margin-bottom: 30px; }
    .admin-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .admin-form .full { grid-column: 1 / -1; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 12px; background: rgba(18, 17, 15, 0.8); border: 1px solid rgba(184, 153, 106, 0.2); border-radius: 6px; color: var(--text-bright); font-family: inherit; font-size: 0.95rem; box-sizing: border-box; }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--rame); }
    .btn-admin { padding: 10px 20px; background: var(--rame); color: var(--bg-deep); border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: opacity 0.2s; }
    .btn-admin:hover { opacity: 0.9; }
    .btn-ghost { background: transparent; border: 1px solid var(--rame); color: var(--rame); }
    .btn-danger { background: #ef4444; color: white; }
    .models-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .models-table th, .models-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(184, 153, 106, 0.1); color: var(--text-gray, #9A958D); font-size: 0.9rem; }
    .models-table th { color: var(--rame); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    .status-active { color: #22c55e; font-weight: 600; }
    .status-inactive { color: #ef4444; }
    .action-btn { background: none; border: none; cursor: pointer; font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; }
    .action-btn.edit { color: var(--rame); }
    .action-btn.delete { color: #ef4444; }
    .action-btn:hover { background: rgba(255,255,255,0.05); }
    @media (max-width: 768px) { .admin-form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner" style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
      <a href="../index.html" class="logo" style="text-decoration: none; color: var(--rame); font-family: 'Cormorant Garamond'; font-size: 1.5rem; font-weight: 600;">Amarreda CMS</a>
      <button id="logout-btn" class="btn-admin btn-ghost">Esci</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="admin-header">
      <h1>Gestione Catalogo Cucine</h1>
      <button class="btn-admin" onclick="toggleForm()">+ Aggiungi Nuovo Modello</button>
    </div>

    <!-- FORM AGGIUNTA/MODIFICA -->
    <div class="admin-card" id="model-form-card" style="display: none;">
      <h3 style="color: var(--text-bright); margin-top: 0; margin-bottom: 20px; font-family: 'Cormorant Garamond'; font-size: 1.5rem;" id="form-title">Aggiungi Modello</h3>
      <form id="catalog-form" class="admin-form">
        <input type="hidden" id="model-id">
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Brand *</label>
          <select id="brand" class="form-select" required>
            <option value="Veneta Cucine">Veneta Cucine</option>
            <option value="Stosa">Stosa</option>
            <option value="Lube">Lube</option>
            <option value="Arredo3">Arredo3</option>
            <option value="Altro">Altro</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Nome Modello *</label>
          <input type="text" id="model_name" class="form-input" required placeholder="Es. Essenza">
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Stile *</label>
          <select id="style" class="form-select" required>
            <option value="moderno">Moderno</option>
            <option value="classico">Classico</option>
            <option value="contemporaneo">Contemporaneo</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Materiale *</label>
          <select id="material" class="form-select" required>
            <option value="laminato">Laminato</option>
            <option value="laccato">Laccato</option>
            <option value="fenix">Fenix</option>
            <option value="legno">Legno</option>
            <option value="vetro">Vetro</option>
          </select>
        </div>
        <div class="full">
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px;">URL Immagine</label>
          <input type="text" id="image_url" class="form-input" placeholder="Es. ../assets/catalogo/veneta-essenza.jpg (Lascia vuoto per segnaposto)">
        </div>
        <div class="full">
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Descrizione</label>
          <textarea id="description" class="form-textarea" placeholder="Breve descrizione del modello..."></textarea>
        </div>
        <div class="full" style="display: flex; gap: 10px; margin-top: 10px;">
          <button type="submit" class="btn-admin">💾 Salva Modello</button>
          <button type="button" class="btn-admin btn-ghost" onclick="toggleForm()">Annulla</button>
        </div>
      </form>
    </div>

    <!-- TABELLA MODELLI -->
    <div class="admin-card">
      <h3 style="color: var(--text-bright); margin-top: 0; margin-bottom: 20px; font-family: 'Cormorant Garamond'; font-size: 1.5rem;">Modelli nel Database</h3>
      <div style="overflow-x: auto;">
        <table class="models-table">
          <thead>
            <tr>
              <th>Brand</th>
              <th>Modello</th>
              <th>Stile</th>
              <th>Materiale</th>
              <th>Stato</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="models-tbody">
            <tr><td colspan="6" style="text-align: center; padding: 20px;">Caricamento dati...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script>
    // 1. CONTROLLO SICUREZZA (Solo Admin)
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      
      const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
      
      if (!profile || profile.role !== 'admin') {
        alert('⛔ Accesso negato. Questa area è riservata agli amministratori.');
        window.location.href = '../index.html';
      }
    }
    checkAuth();

    // 2. LOGOUT
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '../index.html';
    });

    // 3. CARICAMENTO MODELLI
    async function loadModels() {
      const { data, error } = await supabaseClient.from('catalog_models').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('models-tbody');
      tbody.innerHTML = '';
      
      if (error || !data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">Nessun modello presente o errore di lettura.</td></tr>';
        return;
      }

      data.forEach(model => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${model.brand}</td>
          <td><strong>${model.model_name}</strong></td>
          <td>${model.style}</td>
          <td>${model.material}</td>
          <td class="${model.is_active ? 'status-active' : 'status-inactive'}">${model.is_active ? 'Attivo' : 'Nascosto'}</td>
          <td>
            <button class="action-btn edit" onclick="editModel('${model.id}')">Modifica</button>
            <button class="action-btn delete" onclick="deleteModel('${model.id}')">Elimina</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
    loadModels();

    // 4. GESTIONE FORM
    function toggleForm() {
      const formCard = document.getElementById('model-form-card');
      const isVisible = formCard.style.display === 'block';
      formCard.style.display = isVisible ? 'none' : 'block';
      document.getElementById('catalog-form').reset();
      document.getElementById('model-id').value = '';
      document.getElementById('form-title').textContent = 'Aggiungi Modello';
      if (!isVisible) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('catalog-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('model-id').value;
      const payload = {
        brand: document.getElementById('brand').value,
        model_name: document.getElementById('model_name').value,
        style: document.getElementById('style').value,
        material: document.getElementById('material').value,
        image_url: document.getElementById('image_url').value || null,
        description: document.getElementById('description').value,
        is_active: true
      };

      let error;
      if (id) {
        const res = await supabaseClient.from('catalog_models').update(payload).eq('id', id);
        error = res.error;
      } else {
        const res = await supabaseClient.from('catalog_models').insert(payload);
        error = res.error;
      }

      if (error) {
        alert(' Errore nel salvataggio: ' + error.message);
      } else {
        alert('✅ Modello salvato con successo!');
        toggleForm();
        loadModels();
      }
    });

    // 5. MODIFICA ED ELIMINA
    window.editModel = async function(id) {
      const { data } = await supabaseClient.from('catalog_models').select('*').eq('id', id).single();
      if (!data) return;
      
      document.getElementById('model-id').value = data.id;
      document.getElementById('brand').value = data.brand;
      document.getElementById('model_name').value = data.model_name;
      document.getElementById('style').value = data.style;
      document.getElementById('material').value = data.material;
      document.getElementById('image_url').value = data.image_url || '';
      document.getElementById('description').value = data.description || '';
      
      document.getElementById('form-title').textContent = 'Modifica Modello: ' + data.model_name;
      document.getElementById('model-form-card').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.deleteModel = async function(id) {
      if (!confirm('⚠️ Sei sicura di voler eliminare definitivamente questo modello?')) return;
      const { error } = await supabaseClient.from('catalog_models').delete().eq('id', id);
      if (error) alert('❌ Errore: ' + error.message);
      else {
        alert('✅ Modello eliminato.');
        loadModels();
      }
    }
  </script>
</body>
</html>
